name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Native Rust checks (formatting, lints, WIT validation, and the Wasmtime
  # tests). No JS host is needed here, so setup.sh's npm steps are skipped.
  rust-checks:
    runs-on: ubuntu-latest
    # WebRTC handshakes can hang; cap the job so a stuck run fails fast instead
    # of waiting for the default 6h limit.
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        # The toolchain version, wasm targets, and rustfmt/clippy components are
        # pinned in rust-toolchain.toml; `rustup show` installs exactly those.
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        # Caches the cargo registry, `~/.cargo/bin` (so cargo-binstall'd
        # wasm-tools/just/nextest are reused), and the compiled `target/`
        # artifacts, so clippy and test reuse prior builds.
        uses: Swatinem/rust-cache@v2
        with:
          # One cache entry per job: GitHub caches are immutable per key, so a
          # key shared across jobs is only ever saved by whichever job finishes
          # first — every other job restores artifacts for the wrong
          # profile/target set and recompiles from scratch on every run.
          shared-key: rust-checks
          # The standalone manual-signaling test guest builds into a nested
          # target dir under ./target; keep the whole tree so it is not pruned.
          cache-all-crates: true
          # Save only on main: PR jobs restore main's cache (falling back to a
          # prefix match when the PR changes Cargo.lock) but never save, so PR
          # branches don't multiply cache entries toward the repository's
          # 10 GB cap and evict the caches every run depends on.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        # This job never runs the Node host or the netns lab, so skip their
        # dependencies.
        run: SKIP_NETNS_LAB=1 ./scripts/setup.sh
        # cargo-binstall resolves releases through api.github.com; unauthenticated
        # requests share a 60/hour per-IP limit that pooled runner IPs exhaust
        # (intermittent 403s). The token moves it to the per-token limit.
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run the rust checks
        run: just gha::rust-checks
