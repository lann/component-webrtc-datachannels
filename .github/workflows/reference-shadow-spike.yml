# The reference-peer Shadow compatibility spike: does Node + libwebrtc
# (@roamhq/wrtc) run under the Shadow network simulator? Runs
# `just conformance::shadow-reference-spike` (see
# conformance/adapters/reference/shadow-spike.sh for the stages and their
# failure isolation) on an x86-64 runner — Shadow is x86-64-only, so this
# cannot run on arm64 development machines.
#
# Dispatch-only: this is a spike answering a design question (can the
# conformance suite's non-wasm reference peer get Shadow-lab coverage?), not a
# CI gate.

name: reference-shadow-spike

on:
  workflow_dispatch:
  # workflow_dispatch is only registered once the file reaches the default
  # branch; the push trigger lets the spike run from its own branch.
  push:
    branches: [node-webrtc-interop]

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: conformance-build
          save-if: false

      # Fetch the prebuilt Shadow from the `shadow-dev` prerelease into ~/.local
      # (bin/shadow + lib/libshadow_*.so); ~/.local/bin lands on PATH for the
      # steps below.
      - name: Download Shadow from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/download-shadow.sh

      # Rust wasm targets, wasm-tools, just, wasmtime; skip the Node and
      # netns-lab dependencies (the spike installs its own npm packages).
      - name: Install dependencies
        run: SKIP_NODE=1 SKIP_NETNS_LAB=1 ./scripts/setup.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run the spike
        run: just conformance::shadow-reference-spike

      - name: Upload spike outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-ref-spike
          path: target/shadow-ref-spike/
          retention-days: 7
