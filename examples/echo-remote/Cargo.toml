[package]
name = "echo-remote"
version = "0.1.0"
edition = "2021"
publish = false
description = "One peer of a two-process WebRTC echo run: a component that connects to a genuinely separate peer instance through demo:webrtc-echo/rendezvous signaling and the standard polymorph:webrtc-datachannels/connections interface."

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.59", features = ["async"] }
futures = { version = "0.3", default-features = false, features = ["async-await"] }
# The opaque rendezvous blob encoding (JSON `Signal` values, the same schema
# the conformance guest uses over its mailbox).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
