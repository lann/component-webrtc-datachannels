[workspace]
members = [
    "wasmtime-impl",
    "wasip3-impl",
    "examples/wasmtime-demo",
    "examples/echo-demo",
    "examples/cli-signaling",
    "examples/echo-remote",
    "examples/echo-remote/driver",
    "examples/rendezvous-http",
    "examples/webrtc-consumer",
    "conformance/signaling/server",
    "conformance/suite-body",
    "conformance/guest-ct",
    "conformance/guest-pair-ct",
    "conformance/driver-ct",
    "conformance/reference",
    "conformance/wasip3-mailbox",
]
# The crates cargo operates on when invoked without a package selection: the
# native (host-target) crates. The rest are wasm-only components that must be
# built with an explicit `-p <crate> --target wasm32-...`, so bare
# `cargo clippy` / `cargo nextest run` / `cargo test` cover exactly the native
# set instead of needing a per-crate `--exclude` list.
default-members = [
    "wasmtime-impl",
    "examples/wasmtime-demo",
    "conformance/signaling/server",
    "conformance/driver-ct",
    "conformance/reference",
]
resolver = "2"

# Pin the WebRTC stack once, here, so every member (and any future wasm build)
# resolves the same source. The pins are one git rev rather than crates.io
# versions because they carry a fix in no published release: `rtc-sctp`
# discarded received-but-undelivered messages on an incoming stream reset
# (https://github.com/lann/rtc/pull/1, rev 89f518ea4bba; the receive-side data
# loss of
# https://github.com/polymorph-components/polymorph-webrtc-datachannels/issues/125).
# `webrtc` (the async driver, backing the native wasmtime host) consumes `rtc`
# (the sans-I/O core, run in-guest by wasip3-impl) as an in-repo submodule
# path dependency, which no version requirement or `[patch]` can redirect — so
# both crates resolve from one `lann/webrtc` branch whose only delta from
# upstream master (version 0.21.0, unreleased) is that submodule pointed at
# the fixed rev: the direct `rtc` dependency and the host's transitive
# `rtc-sctp` are then the same package, from the same source. Return to plain
# crates.io versions once releases including the fix ship
# (https://github.com/polymorph-components/polymorph-webrtc-datachannels/issues/120).
[workspace.dependencies]
rtc = { git = "https://github.com/lann/webrtc.git", rev = "15755c6b99458ea5a4fe84af0e0bc773956860d2" }
webrtc = { git = "https://github.com/lann/webrtc.git", rev = "15755c6b99458ea5a4fe84af0e0bc773956860d2" }
# The component-test harness arrives two ways, both naming one release:
# the crates here are rev-pinned (no registry release yet), and the JS
# runner core is jsr:@polymorph/test's npm-compat package
# (@jsr/polymorph__test, resolved through npm.jsr.io per
# conformance/driver-ct/polyengine/.npmrc), version-pinned in that tree's
# package.json/package-lock.json. Bump the cargo side with
# `component-test pins bump <rev> --cargo-toml Cargo.toml --workflow
# .github/workflows/conformance.yml`, then the follow-ups it prints
# (`cargo update`); bump the JS side by setting the matching release
# version on conformance/driver-ct/polyengine/package.json's
# @jsr/polymorph__test dependency and running `npm install` there. The
# cargo pins gate (conformance::_ct-tools), the JS runner-js pin gate
# (scripts/check-runner-js-pin.sh), and the actions' own ref checks fail
# on skew.
component-test-sdk = { git = "https://github.com/polymorph-components/polymorph-test", rev = "9f9e4d544b90e3321ac0572be92c57339b963d34" }
component-test-runner = { git = "https://github.com/polymorph-components/polymorph-test", rev = "9f9e4d544b90e3321ac0572be92c57339b963d34" }
component-test-formats = { git = "https://github.com/polymorph-components/polymorph-test", rev = "9f9e4d544b90e3321ac0572be92c57339b963d34" }
component-test-results = { git = "https://github.com/polymorph-components/polymorph-test", rev = "9f9e4d544b90e3321ac0572be92c57339b963d34" }
