[workspace]
members = [
    "wasmtime-impl",
    "wasip3-impl",
    "examples/wasmtime-demo",
    "examples/echo-demo",
    "examples/cli-signaling",
    "examples/echo-remote",
    "examples/echo-remote/driver",
    "examples/rendezvous-http",
    "examples/webrtc-consumer",
    "conformance/signaling/server",
    "conformance/suite-body",
    "conformance/guest-ct",
    "conformance/guest-pair-ct",
    "conformance/driver-ct",
    "conformance/reference",
    "conformance/wasip3-mailbox",
]
# The crates cargo operates on when invoked without a package selection: the
# native (host-target) crates. The rest are wasm-only components that must be
# built with an explicit `-p <crate> --target wasm32-...`, so bare
# `cargo clippy` / `cargo nextest run` / `cargo test` cover exactly the native
# set instead of needing a per-crate `--exclude` list.
default-members = [
    "wasmtime-impl",
    "examples/wasmtime-demo",
    "conformance/signaling/server",
    "conformance/driver-ct",
    "conformance/reference",
]
resolver = "2"

# Pin the WebRTC stack once, here, so every member (and any future wasm build)
# resolves the same source: `webrtc` (the async driver, backing the native
# wasmtime host) and `rtc` (the sans-I/O core, run in-guest by wasip3-impl)
# are released in lockstep from one upstream tree, and `webrtc` depends on the
# exact `rtc` version it shipped with, so the two must agree. Exact pins
# because 0.21.0 is still in pre-release: an `rc` tolerates no wildcard, and
# behaviour the conformance suite asserts (the RFC 6525 drain-before-reset of
# webrtc-rs/rtc#200, the srflx source-address check of webrtc-rs/rtc#136)
# entered the series only in the release candidates.
[workspace.dependencies]
rtc = "=0.21.0-rc.2"
webrtc = "=0.21.0-rc.2"
# The component-test harness, rev-pinned (no registry release yet).
# One rev everywhere: these four entries, the deltic driver's
# package.json pin, the actions/*@<rev> refs in conformance.yml, and
# the CLI install (conformance/justfile reads the rev back out of
# Cargo.lock). Bump with `component-test pins bump <rev> --cargo-toml
# Cargo.toml --package-json conformance/driver-ct/deltic/package.json
# --workflow .github/workflows/conformance.yml`, then the follow-ups
# it prints.
component-test-sdk = { git = "https://github.com/polymorph-components/polymorph-test", rev = "aca1008344f754db1c2b88da05cb5999333f8d6a" }
component-test-runner = { git = "https://github.com/polymorph-components/polymorph-test", rev = "aca1008344f754db1c2b88da05cb5999333f8d6a" }
component-test-formats = { git = "https://github.com/polymorph-components/polymorph-test", rev = "aca1008344f754db1c2b88da05cb5999333f8d6a" }
component-test-results = { git = "https://github.com/polymorph-components/polymorph-test", rev = "aca1008344f754db1c2b88da05cb5999333f8d6a" }
