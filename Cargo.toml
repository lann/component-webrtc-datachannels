[workspace]
members = [
    "wasmtime-impl",
    "wasip3-impl",
    "examples/wasmtime-demo",
    "examples/echo-demo",
    "examples/cli-signaling",
    "examples/echo-remote",
    "examples/echo-remote/driver",
    "examples/rendezvous-http",
    "examples/webrtc-consumer",
    "conformance/signaling/server",
    "conformance/suite-body",
    "conformance/guest-ct",
    "conformance/guest-pair-ct",
    "conformance/driver-ct",
    "conformance/reference",
    "conformance/wasip3-mailbox",
]
# The crates cargo operates on when invoked without a package selection: the
# native (host-target) crates. The rest are wasm-only components that must be
# built with an explicit `-p <crate> --target wasm32-...`, so bare
# `cargo clippy` / `cargo nextest run` / `cargo test` cover exactly the native
# set instead of needing a per-crate `--exclude` list.
default-members = [
    "wasmtime-impl",
    "examples/wasmtime-demo",
    "conformance/signaling/server",
    "conformance/driver-ct",
    "conformance/reference",
]
resolver = "2"

# Pin the sans-I/O WebRTC stack once, here, so every member (and any future wasm
# build) resolves the same source. 0.20.0 is the first stable release carrying
# the empty-message receive fix (webrtc-rs/rtc#131), the srflx source-address
# fix (#136), `RTCDataChannel::send` rejecting sends the write path cannot
# carry out (#138), and `RTCDataChannelInit::ordered` defaulting to `true` as
# documented (#140).
[workspace.dependencies]
rtc = "0.20.0"
# The component-test harness, rev-pinned (no registry release yet).
# One rev everywhere: these three entries and the CLI install
# (conformance/driver-ct/justfile reads the rev back out of Cargo.lock).
# Bump all together, then `cargo update component-test-sdk
# component-test-runner component-test-formats`.
component-test-sdk = { git = "https://github.com/polymorph-components/polymorph-test", rev = "824d100349dc7804c9bf1723d9b1ba0ed40fa940" }
component-test-runner = { git = "https://github.com/polymorph-components/polymorph-test", rev = "824d100349dc7804c9bf1723d9b1ba0ed40fa940" }
component-test-formats = { git = "https://github.com/polymorph-components/polymorph-test", rev = "824d100349dc7804c9bf1723d9b1ba0ed40fa940" }
component-test-results = { git = "https://github.com/polymorph-components/polymorph-test", rev = "824d100349dc7804c9bf1723d9b1ba0ed40fa940" }
